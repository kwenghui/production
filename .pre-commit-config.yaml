# Install once:  pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: sage-check-secrets
        name: Sage offline secret / forbidden-file scan
        entry: python tools/check_secrets.py
        language: system
        pass_filenames: true
      - id: sage-ruff-format
        name: ruff format (project formatter; same check as CI)
        entry: ruff format
        language: system
        types: [python]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4          # pin; review release notes before bumping
    hooks:
      - id: gitleaks
